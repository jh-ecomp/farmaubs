language: 'typescript'
stack: 'frontend'

dependsOn:
  - 'shared'

tasks:
  dev:
    command: 'pnpm exec vite'
    options:
      persistent: true
      runInCI: false
    deps:
      - 'shared:build'

  build:
    command: 'pnpm run build'
    inputs:
      - 'src/**/*'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig*.json'
    outputs:
      - 'dist'
    deps:
      - 'shared:build'

  test:
    command: 'pnpm exec vitest run'
    inputs:
      - 'src/**/*'
      - 'vite.config.ts'
      - 'tsconfig*.json'
    deps:
      - 'shared:build'

  test-bdd:
    command: 'pnpm run test:bdd'
    options:
      mutex: 'playwright-e2e'
    inputs:
      - 'src/**/*'
      - 'e2e/**/*'
      - 'playwright.config.ts'
      - 'vite.config.ts'
    deps:
      - 'shared:build'

  test-e2e:
    command: 'pnpm run test:e2e'
    options:
      mutex: 'playwright-e2e'
    env:
      PW_MODE: 'fullstack'
    inputs:
      - 'src/**/*'
      - 'e2e/**/*'
      - 'playwright.config.ts'
      - 'vite.config.ts'
    deps:
      - 'shared:build'

  lint:
    command: 'pnpm exec eslint .'
    inputs:
      - 'src/**/*'
      - 'eslint.config.js'

  preview:
    command: 'pnpm exec vite preview'
    options:
      persistent: true
      runInCI: false
