# FarmaUBS — overrides de desenvolvimento local (ADR-023)
# Hot-reload, portas expostas e bind mount do código-fonte.
services:
  postgres:
    ports:
      - "5434:5432"

  api:
    build:
      target: dev
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      npm_config_store_dir: /pnpm-store
    ports:
      - "3000:3000"
    working_dir: /app
    volumes:
      - ..:/app
      - node_modules_root:/app/node_modules
      - node_modules_backend:/app/apps/backend/node_modules
      - node_modules_frontend:/app/apps/frontend/node_modules
      - node_modules_shared:/app/packages/shared/node_modules
      - pnpm_store:/pnpm-store
    command: pnpm --filter @farmaubs/backend start:dev

  frontend:
    build:
      target: dev
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      npm_config_store_dir: /pnpm-store
    ports:
      - "5173:5173"
    working_dir: /app
    volumes:
      - ..:/app
      - node_modules_root:/app/node_modules
      - node_modules_backend:/app/apps/backend/node_modules
      - node_modules_frontend:/app/apps/frontend/node_modules
      - node_modules_shared:/app/packages/shared/node_modules
      - pnpm_store:/pnpm-store
    command: pnpm --filter @farmaubs/frontend dev

volumes:
  node_modules_root:
  node_modules_backend:
  node_modules_frontend:
  node_modules_shared:
  pnpm_store:
